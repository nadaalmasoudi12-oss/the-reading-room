
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore Books | The Reading Room</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <h1 class="logo">The Reading Room</h1>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="books.html" aria-current="page">Explore Books</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- Page Introduction -->
        <section class="library-intro">
            <span class="section-label">
                THE READING ROOM COLLECTION
            </span>

            <h1>Explore Our Library</h1>

            <p>
                Discover stories worth reading,
                from timeless classics to modern favorites.
            </p>
        </section>

        <!-- Search and Filters -->
        <section class="library-section">

            <div class="library-controls">

                <label for="searchInput">
                    Find your next read
                </label>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search by title or author..."
                >

                <div class="categories" id="genreFilters">
                    <button type="button" data-genre="All" class="active">All Books</button>
                    <button type="button" data-genre="Classics">Classics</button>
                    <button type="button" data-genre="Dystopian">Dystopian</button>
                    <button type="button" data-genre="Drama">Drama</button>
                    <button type="button" data-genre="Fantasy">Fantasy</button>
                    <button type="button" data-genre="Horror">Horror</button>
                </div>

            </div>

            <p id="resultsCount" aria-live="polite"></p>

            <!-- Books will be generated by JavaScript -->
            <div class="books-container" id="booksGrid"></div>

            <p id="emptyMessage" hidden>
                No books found. Try another search or genre.
            </p>

        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 The Reading Room. All rights reserved.</p>
        </div>
    </footer>

    <script src="books-data.js"></script>
    <script src="books.js"></script>

</body>
</html>
